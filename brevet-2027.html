<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Révisions Brevet 2027 · Lycée Français Molière de Saragosse</title>
  <style>
:root{
  --bg:#eef1fa;
  --card:#ffffff;
  --ink:#1a1f36;
  --muted:#6b7488;
  --line:#e7eaf3;
  --primary:#4f46e5;
  --primary-dark:#4338ca;
  --shadow-sm:0 2px 10px rgba(26,31,54,.06);
  --shadow:0 10px 34px rgba(26,31,54,.10);
  --shadow-lg:0 20px 50px rgba(26,31,54,.16);
  --radius:20px;

  /* couleurs par matière */
  --maths:#4f46e5;
  --francais:#e11d74;
  --histoire:#c2620a;
  --geographie:#0d9488;
  --emc:#7c3aed;
  --svt:#15a34a;
  --physique:#ea580c;
  --techno:#3f4c66;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color:var(--ink);
  line-height:1.6;
  min-height:100vh;
  background:
    radial-gradient(1100px 620px at 8% -8%, #dfe7ff 0%, rgba(223,231,255,0) 55%),
    radial-gradient(1000px 560px at 108% 4%, #ffe1ef 0%, rgba(255,225,239,0) 52%),
    radial-gradient(900px 620px at 60% 108%, #d6f7ee 0%, rgba(214,247,238,0) 55%),
    var(--bg);
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shine{to{transform:translateX(240%) rotate(25deg)}}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.72);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid rgba(231,234,243,.9);
}
.topbar-inner{
  max-width:1120px;margin:0 auto;padding:14px 22px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:13px}
.brand-logo{
  width:46px;height:46px;border-radius:14px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#e11d74);
  color:#fff;font-weight:800;font-size:23px;
  display:grid;place-items:center;
  box-shadow:0 8px 20px rgba(79,70,229,.4);
}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-text strong{font-size:16px;letter-spacing:-.01em}
.brand-text small{color:var(--muted);font-size:12px}

.search{margin-left:auto;display:flex;align-items:center;gap:6px;
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:6px 8px 6px 18px;min-width:min(370px,60vw);
  box-shadow:var(--shadow-sm);transition:.2s}
.search:focus-within{border-color:#c3c8f0;box-shadow:0 0 0 4px rgba(79,70,229,.14)}
.search input{border:0;background:transparent;outline:none;flex:1;font-size:15px;color:var(--ink);font-family:inherit}
.search button{border:0;background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;
  width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:15px;transition:.2s}
.search button:hover{transform:scale(1.07)}

.subjectnav{
  max-width:1120px;margin:0 auto;padding:0 16px 12px;
  display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;
}
.subjectnav::-webkit-scrollbar{display:none}
.subjectnav a{
  white-space:nowrap;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;
  color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.7);transition:.18s;
}
.subjectnav a:hover{color:var(--ink);border-color:#cfd5ea;transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.subjectnav a.active{color:#fff;background:linear-gradient(135deg,var(--primary),#7c3aed);
  border-color:transparent;box-shadow:0 8px 18px rgba(79,70,229,.34)}

/* ---------- Layout ---------- */
.container{max-width:1120px;margin:0 auto;padding:30px 22px 70px;animation:fadeUp .45s both}
.section-title{display:flex;align-items:center;gap:14px;margin:4px 0 20px}
.section-title h1{font-size:30px;margin:0;letter-spacing:-.02em}
.section-title .count{color:var(--muted);font-size:14px;font-weight:600;
  background:#fff;padding:5px 12px;border-radius:999px;box-shadow:var(--shadow-sm)}
.lead{color:var(--muted);margin:0 0 22px;max-width:70ch}

/* ---------- Hero / accueil ---------- */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(125deg,#4338ca 0%,#6d28d9 45%,#be185d 100%);
  color:#fff;border-radius:26px;padding:34px 34px;margin-bottom:26px;
  box-shadow:var(--shadow-lg);
}
.hero::before{content:"";position:absolute;inset:0;
  background:radial-gradient(520px 240px at 88% -30%, rgba(255,255,255,.28), transparent 60%);
  pointer-events:none}
.hero::after{content:"🎓";position:absolute;right:26px;bottom:-14px;font-size:120px;opacity:.14;transform:rotate(-8deg)}
.hero h1{margin:0 0 8px;font-size:30px;font-weight:800;letter-spacing:-.02em;position:relative}
.hero p{margin:0;opacity:.94;font-size:16px;max-width:60ch;position:relative}
.hero .countdown{margin-top:18px;font-size:14px;font-weight:600;position:relative;
  display:inline-block;background:rgba(255,255,255,.18);padding:8px 16px;border-radius:999px;
  border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(4px)}

.progresswrap{margin:22px 0 8px;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-sm)}
.progressbar{height:14px;background:#eceffa;border-radius:999px;overflow:hidden}
.progressbar>span{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(90deg,#10b981,#22c55e 60%,#84cc16);box-shadow:0 0 14px rgba(34,197,94,.5)}
.progresswrap small{color:var(--muted);display:inline-block;margin-top:9px;font-weight:500}
.progresswrap small b{color:var(--ink)}

.daily-label{display:flex;align-items:center;gap:12px;margin:32px 0 14px}
.daily-label h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.daily-label .pill{background:linear-gradient(135deg,#fff3d6,#ffe1c4);color:#a15c00;font-size:12px;font-weight:800;
  padding:5px 12px;border-radius:999px;border:1px solid #f6d18a;box-shadow:var(--shadow-sm)}

/* ---------- Grille de matières (accueil) ---------- */
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:16px;margin-top:14px}
.subject-card{
  position:relative;overflow:hidden;
  background:
    linear-gradient(160deg, color-mix(in srgb, var(--c,#888) 10%, #fff), #fff 62%);
  border:1px solid var(--line);border-radius:18px;padding:20px;
  cursor:pointer;transition:transform .2s, box-shadow .2s;
  animation:pop .4s both;
}
.subject-card:hover{transform:translateY(-4px);box-shadow:0 18px 34px color-mix(in srgb, var(--c,#888) 26%, transparent)}
.subject-card .emoji{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;
  background:color-mix(in srgb, var(--c,#888) 16%, #fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,#888) 20%,transparent)}
.subject-card h3{margin:12px 0 2px;font-size:17px;font-weight:700}
.subject-card small{color:var(--muted);font-weight:600}
.subject-card::after{content:"→";position:absolute;top:20px;right:20px;color:var(--c,#888);
  font-weight:800;opacity:0;transform:translateX(-6px);transition:.2s}
.subject-card:hover::after{opacity:1;transform:none}

/* ---------- Liste de fiches ---------- */
.fiche-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.fiche-card{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;
  cursor:pointer;transition:transform .2s, box-shadow .2s;position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:9px;animation:fadeUp .4s both;
}
.fiche-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--c,#888),color-mix(in srgb,var(--c,#888) 45%,#fff))}
.fiche-card:hover{transform:translateY(-4px);box-shadow:0 18px 34px color-mix(in srgb,var(--c,#888) 22%,transparent);
  border-color:color-mix(in srgb,var(--c,#888) 30%,var(--line))}
.fiche-grid>*:nth-child(1){animation-delay:.02s}
.fiche-grid>*:nth-child(2){animation-delay:.05s}
.fiche-grid>*:nth-child(3){animation-delay:.08s}
.fiche-grid>*:nth-child(4){animation-delay:.11s}
.fiche-grid>*:nth-child(5){animation-delay:.14s}
.fiche-grid>*:nth-child(6){animation-delay:.17s}
.fiche-grid>*:nth-child(7){animation-delay:.2s}
.fiche-grid>*:nth-child(8){animation-delay:.23s}
.subject-grid>*:nth-child(2){animation-delay:.04s}
.subject-grid>*:nth-child(3){animation-delay:.08s}
.subject-grid>*:nth-child(4){animation-delay:.12s}
.subject-grid>*:nth-child(5){animation-delay:.16s}
.subject-grid>*:nth-child(6){animation-delay:.2s}
.subject-grid>*:nth-child(7){animation-delay:.24s}
.subject-grid>*:nth-child(8){animation-delay:.28s}
.fiche-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:#eef1f9;color:var(--muted)}
.tag.matiere{color:#fff;background:var(--c,#666)}
.tag.niveau{background:#eef1f9;color:#3a4560}
.fiche-card h3{margin:2px 0;font-size:16.5px;line-height:1.35;font-weight:700}
.fiche-card .kw{color:var(--muted);font-size:13px}
.fiche-card .seen{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:50%;
  background:#16a34a;color:#fff;display:grid;place-items:center;font-size:14px;opacity:0;transform:scale(.5);transition:.2s}
.fiche-card.is-seen .seen{opacity:1;transform:none}

/* filtres niveau */
.filters{display:flex;gap:9px;margin-bottom:20px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;color:var(--muted);
  padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:.18s}
.filters button:hover{border-color:#cfd5ea;transform:translateY(-1px)}
.filters button.active{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:var(--shadow-sm)}

/* ---------- Fiche détail ---------- */
.fiche{background:var(--card);border:1px solid var(--line);border-radius:24px;
  box-shadow:var(--shadow-lg);overflow:hidden;max-width:840px;margin:0 auto;animation:pop .4s both}
.fiche-head{position:relative;overflow:hidden;padding:28px 30px;color:#fff;
  background:linear-gradient(130deg, var(--c,#333), color-mix(in srgb, var(--c,#333) 62%, #000 12%))}
.fiche-head::before{content:"";position:absolute;inset:0;
  background:radial-gradient(420px 200px at 90% -40%, rgba(255,255,255,.3), transparent 60%)}
.fiche-head .tags{display:flex;gap:8px;margin-bottom:12px;position:relative}
.fiche-head .tags .tag{background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(3px)}
.fiche-head h1{margin:0;font-size:29px;font-weight:800;letter-spacing:-.02em;position:relative}
.fiche-body{padding:26px 30px}
.block{margin-bottom:24px}
.block h2{font-size:13px;margin:0 0 12px;display:flex;align-items:center;gap:8px;
  text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--c,#333)}
.block ul{margin:0;padding-left:6px;list-style:none}
.block ul li{position:relative;padding-left:24px;margin:8px 0}
.block ul li::before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;border-radius:50%;
  background:var(--c,#333);opacity:.55}
.block p{margin:0 0 10px}
.notion{border-left:3px solid color-mix(in srgb,var(--c,#333) 40%,var(--line));
  background:color-mix(in srgb,var(--c,#333) 5%,#fff);border-radius:0 10px 10px 0;
  padding:8px 14px;margin:9px 0}
.notion b{color:var(--ink)}
.methode{counter-reset:step;list-style:none;padding-left:0}
.methode li{position:relative;padding-left:42px;margin:12px 0}
.methode li::before{counter-increment:step;content:counter(step);
  position:absolute;left:0;top:-3px;width:28px;height:28px;border-radius:9px;
  background:linear-gradient(135deg,var(--c,#333),color-mix(in srgb,var(--c,#333) 55%,#000 10%));
  color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;box-shadow:var(--shadow-sm)}
.retenir{background:linear-gradient(135deg,#fffbeb,#fef6d8);border:1px solid #fde68a;border-radius:16px;padding:16px 18px}
.retenir h2{color:#a15c00}
.exemple{background:linear-gradient(135deg,#f0f6ff,#eaf1ff);border:1px solid #d6e4ff;border-radius:16px;padding:16px 18px}
.redac{background:linear-gradient(135deg,#ecfdf5,#e0f2f1);border:1px solid #a7e8d5;border-radius:16px;padding:16px 18px;margin-bottom:24px}
.redac h2{color:#0f766e;font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.redac p{margin:0 0 10px}
.redac-vocab{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.redac-vocab .lbl{font-weight:700;color:#0f766e;font-size:13px;margin-right:2px}
.redac-vocab span:not(.lbl){background:#fff;border:1px solid #a7e8d5;color:#0f766e;
  font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:color-mix(in srgb,var(--c,#666) 10%,#fff);color:color-mix(in srgb,var(--c,#666) 65%,#333);
  font-size:13px;font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer;transition:.16s;
  border:1px solid color-mix(in srgb,var(--c,#666) 20%,transparent)}
.chips span:hover{background:var(--c,#666);color:#fff;transform:translateY(-1px)}
kbd{background:#eef1f9;border-radius:6px;padding:1px 7px;font-family:inherit;font-size:.95em;border:1px solid var(--line)}

.fiche-foot{display:flex;justify-content:space-between;align-items:center;
  padding:18px 30px;border-top:1px solid var(--line);background:#fbfcfe;flex-wrap:wrap;gap:12px}
.btn{border:0;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:800;cursor:pointer;
  font-family:inherit;transition:.18s}
.btn:hover{transform:translateY(-2px)}
.btn-check{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 8px 18px rgba(22,163,74,.32)}
.btn-check.done{background:#e7f6ec;color:#15803d;border:1px solid #a7e0ba;box-shadow:none}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--muted)}
.btn-random{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;box-shadow:0 8px 18px rgba(79,70,229,.32)}

.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;
  margin-bottom:18px;cursor:pointer;background:#fff;padding:8px 16px;border-radius:999px;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:.18s}
.backlink:hover{color:var(--ink);transform:translateX(-3px)}

.empty{text-align:center;padding:64px 20px;color:var(--muted);background:#fff;border-radius:20px;
  border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.empty .big{font-size:46px;margin-bottom:8px}

/* ---------- Pratique (annales) ---------- */
.prat-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;
  transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--c,#888);animation:fadeUp .4s both}
.prat-card:hover{transform:translateY(-4px);box-shadow:0 18px 34px color-mix(in srgb,var(--c,#888) 22%,transparent)}
.prat-card h3{margin:2px 0;font-size:18px;font-weight:800}
.prat-themes{display:flex;flex-wrap:wrap;gap:6px}
.prat-themes span{background:#eef1f9;color:var(--muted);font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.fiche.prat .fiche-body>p{margin:0 0 12px}
.prat-officiel{display:inline-block;background:color-mix(in srgb,var(--c,#4f46e5) 10%,#fff);
  color:color-mix(in srgb,var(--c,#4f46e5) 70%,#222);border:1px solid color-mix(in srgb,var(--c,#4f46e5) 30%,transparent);
  padding:9px 15px;border-radius:12px;font-weight:700;font-size:14px}
.prat-officiel:hover{background:color-mix(in srgb,var(--c,#4f46e5) 18%,#fff)}
.prat-toolbar{margin:16px 0 6px}
.prat-exo{margin-top:22px}
.prat-exo h2{font-size:15px;font-weight:800;color:var(--c,#333);margin:0 0 12px;padding-bottom:8px;
  border-bottom:2px solid color-mix(in srgb,var(--c,#333) 22%,var(--line))}
.prat-q{margin:0 0 16px;padding:14px 16px;background:#f7f9fc;border:1px solid var(--line);border-radius:14px}
.prat-enonce{margin:0;font-weight:600}
.prat-num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;margin-right:8px;
  background:var(--c,#333);color:#fff;font-size:13px;font-weight:800;vertical-align:middle}
.prat-sol{margin-top:12px;background:linear-gradient(135deg,#ecfdf5,#dcfce7);border:1px solid #86efac;
  border-left:4px solid #16a34a;border-radius:10px;padding:12px 14px;color:#14532d}
.prat-sol-lbl{display:block;font-weight:800;color:#15803d;font-size:12.5px;text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:6px}
.prat-exos.hide-sol .prat-sol{display:none}

.footer{max-width:1120px;margin:0 auto;padding:10px 22px 40px;color:var(--muted);font-size:13px;text-align:center}

@media(max-width:640px){
  .search{min-width:100%;order:3}
  .brand-text small{display:none}
  .hero{padding:26px 22px}
  .hero h1,.section-title h1{font-size:24px}
  .fiche-head h1{font-size:23px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}

</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#accueil" class="brand">
        <span class="brand-logo">M</span>
        <span class="brand-text">
          <strong>Révisions Brevet 2027</strong>
          <small>Lycée Français International Molière · Saragosse</small>
        </span>
      </a>
      <form class="search" id="searchForm" role="search">
        <input id="searchInput" type="search" placeholder="Rechercher un thème, un mot-clé…"
               autocomplete="off" aria-label="Rechercher une fiche" />
        <button type="submit" aria-label="Rechercher">🔍</button>
      </form>
    </div>
    <nav class="subjectnav" id="subjectnav"></nav>
  </header>

  <main id="app" class="container"></main>

  <footer class="footer">
    <p>Fiches de révision · programmes du cycle 4 (5<sup>e</sup>–4<sup>e</sup>–3<sup>e</sup>) · session 2027.
       Centre étranger — groupe 1.</p>
  </footer>

  <!-- Données : chaque fichier ajoute ses fiches à window.FICHES -->
  <script>
window.FICHES = (window.FICHES || []).concat([
{
  id:'maths-pythagore', matiereKey:'maths', matiere:'Mathématiques', niveau:'4e',
  titre:'Le théorème de Pythagore',
  motsCles:['triangle rectangle','hypoténuse','longueur','distance','racine carrée','réciproque','contraposée','angle droit'],
  contenu:{
    objectifs:[
      'Calculer la longueur d’un côté dans un triangle rectangle.',
      'Démontrer qu’un triangle est rectangle (réciproque) ou non (contraposée).'
    ],
    notions:[
      {terme:'Hypoténuse', def:'le côté le plus long, toujours opposé à l’angle droit.'},
      {terme:'Théorème (sens direct)', def:'si le triangle ABC est rectangle en A, alors BC² = AB² + AC² (hypoténuse² = somme des carrés des deux autres côtés).'},
      {terme:'Réciproque', def:'si BC² = AB² + AC² (BC étant le plus grand côté), alors ABC est rectangle en A.'},
      {terme:'Contraposée', def:'si BC² ≠ AB² + AC², alors ABC n’est pas rectangle.'}
    ],
    essentiel:'<p>Le théorème de Pythagore relie les trois côtés d’un <b>triangle rectangle</b>. Sens <b>direct</b> : pour <b>calculer une longueur</b> quand on connaît les deux autres côtés. <b>Réciproque</b> : pour <b>prouver un angle droit</b>. <b>Contraposée</b> : pour prouver qu’un triangle <b>n’est pas</b> rectangle, en comparant le carré du plus grand côté avec la somme des carrés des deux autres.</p>',
    methode:[
      'Identifie l’angle droit et nomme l’hypoténuse (côté opposé).',
      'Écris l’égalité : hypoténuse² = côté² + côté².',
      'Pour un côté de l’angle droit, isole-le : côté² = hypoténuse² − autre côté².',

window.FICHES = (window.FICHES || []).concat([
{
  id:'svt-adn-genetique', matiereKey:'svt', matiere:'SVT', niveau:'3e',
  titre:'ADN, chromosomes et information génétique',
  motsCles:['adn','chromosome','gène','noyau','caryotype','allèle','information génétique','cellule','mutation','génome'],
  contenu:{
    objectifs:['Localiser l’information génétique dans la cellule.','Relier cellule, noyau, chromosome, ADN, gène et allèle.','Comprendre l’origine de la diversité des individus.'],
    notions:[
      {terme:'Noyau', def:'partie de la cellule qui contient l’information génétique et commande son fonctionnement.'},
      {terme:'Chromosome', def:'structure formée d’ADN enroulé ; l’espèce humaine en possède 23 paires (46 au total), dont la 23ᵉ détermine le sexe (XX = fille, XY = garçon).'},
      {terme:'Caryotype', def:'photographie classée des chromosomes d’une cellule ; il permet de repérer une anomalie (ex. trisomie 21 = un chromosome 21 en trop).'},
      {terme:'ADN', def:'molécule en forme de double hélice, support universel de l’information génétique chez tous les êtres vivants.'},
      {terme:'Gène', def:'portion d’ADN qui détermine un caractère héréditaire.'},
      {terme:'Allèle', def:'version différente d’un même gène ; un allèle peut être dominant (il s’exprime toujours) ou récessif (seulement s’il est en double).'},
      {terme:'Mutation', def:'modification de l’ADN ; source de nouveaux allèles et de diversité.'}
    ],
    essentiel:'<p>Toutes les cellules d’un individu possèdent la même <b>information génétique</b>, située dans le <b>noyau</b>, portée par les <b>chromosomes</b> constitués d’<b>ADN</b>. Cet ADN est un « programme » écrit avec un langage universel : c’est pourquoi on peut le comparer d’une espèce à l’autre.</p><p>Chaque <b>gène</b> commande un caractère (couleur des yeux, groupe sanguin…) et existe sous plusieurs <b>allèles</b>. Comme chaque individu possède deux exemplaires de chaque chromosome (un du père, un de la mère), il possède <b>deux allèles</b> par gène. Selon qu’ils sont <b>dominants</b> ou <b>récessifs</b>, le caractère observé (phénotype) varie.</p><p>Les <b>mutations</b> (modifications de l’ADN) créent de nouveaux allèles : elles sont à l’origine de la <b>diversité</b> des individus et, sur de longues durées, de l’évolution.</p>',
    exemple:'<p>Groupe sanguin : le gène existe sous les allèles A, B (dominants) et O (récessif). Un individu « A//O » est de groupe A car A domine O ; il faut « O//O » pour être du groupe O.</p>',
    retenir:'Emboîtement : <b>cellule → noyau → chromosome → ADN → gène → allèle</b>. Espèce humaine : <b>46 chromosomes</b> (23 paires) ; 23ᵉ paire = sexe (XX / XY).'
  }
},
{
  id:'svt-herdite', matiereKey:'svt', matiere:'SVT', niveau:'3e',
  titre:'La transmission des caractères héréditaires',
  motsCles:['hérédité','gamète','fécondation','cellule-œuf','23 chromosomes','reproduction sexuée','brassage','jumeaux','dominant','récessif'],
  contenu:{
    objectifs:['Comprendre la transmission des chromosomes des parents à l’enfant.','Expliquer la diversité et la ressemblance familiale.'],
    notions:[
      {terme:'Gamètes', def:'cellules reproductrices (spermatozoïde chez l’homme, ovule chez la femme) ne contenant que 23 chromosomes (moitié de l’information).'},
      {terme:'Fécondation', def:'union d’un spermatozoïde et d’un ovule qui forme la cellule-œuf à 46 chromosomes, première cellule du nouvel individu.'},
      {terme:'Brassage génétique', def:'lors de la formation des gamètes, les chromosomes se répartissent au hasard : chaque gamète est unique.'},
      {terme:'Caractère héréditaire', def:'transmis par les gènes (couleur des yeux) ; à distinguer d’un caractère acquis (bronzage, cicatrice).'}
    ],
    essentiel:'<p>Lors de la <b>reproduction sexuée</b>, chaque parent transmet <b>la moitié</b> de son information génétique par un <b>gamète</b> (23 chromosomes). La <b>fécondation</b> réunit les deux moitiés : l’enfant obtient 46 chromosomes, donc <b>un allèle de chaque parent</b> pour chaque gène.</p><p>Comme la répartition des chromosomes dans les gamètes se fait <b>au hasard</b> et qu’un homme produit des millions de spermatozoïdes tous différents, chaque enfant reçoit une <b>combinaison unique</b> d’allèles. Cela explique à la fois les <b>ressemblances</b> avec les parents et le fait que les frères et sœurs soient <b>différents</b>.</p><p>Cas particulier : les <b>vrais jumeaux</b> proviennent d’une même cellule-œuf → ils ont le même patrimoine génétique.</p>',
    exemple:'<p>Un enfant peut avoir les yeux bleus alors que ses parents ont les yeux marron : chacun portait un allèle « bleu » récessif, transmis ensemble à l’enfant (bleu//bleu).</p>',
    retenir:'23 (père) + 23 (mère) = <b>46 chromosomes</b>. Le <b>brassage</b> au hasard explique que les enfants soient tous différents (sauf vrais jumeaux).'
  }
},
{
  id:'svt-evolution', matiereKey:'svt', matiere:'SVT', niveau:'3e',
  titre:'L’évolution des êtres vivants',
  motsCles:['évolution','sélection naturelle','Darwin','espèce','fossile','ancêtre commun','mutation','adaptation','variabilité'],
  contenu:{
    objectifs:['Expliquer le mécanisme de la sélection naturelle.','Utiliser fossiles et parentés comme preuves de l’évolution.'],
    notions:[
      {terme:'Évolution', def:'transformation des espèces au cours des temps géologiques (millions d’années).'},
      {terme:'Variabilité', def:'au sein d’une espèce, les individus présentent des différences (dues aux mutations et au brassage).'},
      {terme:'Sélection naturelle', def:'dans un milieu donné, les individus les mieux adaptés survivent et se reproduisent davantage : leurs allèles deviennent plus fréquents au fil des générations.'},
      {terme:'Ancêtre commun', def:'des espèces qui partagent des caractères descendent d’un même ancêtre (ex. tous les vertébrés ont un squelette interne).'},
      {terme:'Fossiles', def:'restes ou traces d’êtres vivants du passé, conservés dans les roches ; ils montrent que des espèces ont disparu et que d’autres sont apparues.'}
    ],
    essentiel:'<p>Les espèces ne sont pas fixes : elles <b>évoluent</b>. Le moteur principal est la <b>sélection naturelle</b>, décrite par Charles <b>Darwin</b>. Comme les individus d’une même espèce sont <b>variés</b> (variabilité génétique), certains possèdent des caractères plus <b>avantageux</b> dans leur milieu (mieux se nourrir, échapper aux prédateurs, résister au froid).</p><p>Ces individus survivent mieux et se reproduisent davantage : ils transmettent leurs allèles avantageux. Génération après génération, ces caractères deviennent plus fréquents : l’espèce <b>s’adapte</b> à son milieu. Si un milieu change, les caractères sélectionnés changent aussi.</p><p>Les preuves de l’évolution sont les <b>fossiles</b> (histoire des espèces passées), les <b>ressemblances anatomiques</b> (mêmes os dans le bras humain, l’aile d’oiseau, la nageoire) et les similitudes de l’<b>ADN</b> entre espèces proches.</p>',
    exemple:'<p>Phalène du bouleau : lors de la pollution industrielle, les papillons foncés, mieux camouflés sur les troncs noircis, ont été moins mangés par les oiseaux et sont devenus majoritaires.</p>',
    retenir:'Évolution = <b>variabilité (mutations)</b> + <b>sélection naturelle</b> sur de très longues durées. Fossiles et ADN sont des preuves.'
  }
},
{
  id:'svt-biodiversite', matiereKey:'svt', matiere:'SVT', niveau:'3e',
  titre:'La biodiversité et ses crises',
  motsCles:['biodiversité','extinction','crise biologique','écosystème','espèces','dinosaures','activité humaine','gènes','espèces invasives'],
  contenu:{
    objectifs:['Définir la biodiversité à ses trois niveaux.','Comprendre les crises passées et l’érosion actuelle.'],
    notions:[
      {terme:'Biodiversité', def:'diversité du vivant à trois niveaux : diversité des écosystèmes, diversité des espèces et diversité génétique (des gènes) au sein d’une espèce.'},
      {terme:'Écosystème', def:'ensemble formé par un milieu et les êtres vivants qui y vivent et interagissent.'},
      {terme:'Crise biologique', def:'disparition massive et rapide d’un grand nombre d’espèces ; la Terre en a connu cinq grandes.'},
      {terme:'Espèce invasive', def:'espèce introduite par l’Homme qui se développe au détriment des espèces locales.'}
    ],
    essentiel:'<p>La <b>biodiversité</b> désigne toute la richesse du vivant, à <b>trois niveaux</b> : les milieux (écosystèmes), les espèces, et les gènes à l’intérieur de chaque espèce. Elle rend des services essentiels : pollinisation, épuration de l’eau, fertilité des sols, ressources alimentaires.</p><p>Au cours des temps géologiques, la biodiversité a beaucoup <b>varié</b> : cinq grandes <b>crises</b> ont fait disparaître de nombreuses espèces (ex. la disparition des <b>dinosaures</b> il y a ~66 millions d’années). Après chaque crise, de nouvelles espèces se sont diversifiées.</p><p>Aujourd’hui, l’<b>activité humaine</b> provoque une <b>érosion rapide</b> de la biodiversité. Les causes principales sont : la <b>destruction des habitats</b>, la <b>pollution</b>, le <b>réchauffement climatique</b>, la <b>surexploitation</b> (chasse, pêche) et les <b>espèces invasives</b>. Protéger la biodiversité (réserves, gestes durables) est un enjeu majeur.</p>',
    exemple:'<p>La disparition des abeilles (pesticides, maladies) menace la pollinisation de nombreuses plantes cultivées, donc notre alimentation.</p>',
    retenir:'Biodiversité = <b>3 niveaux</b> (écosystèmes, espèces, gènes). L’humain est aujourd’hui la principale cause de son déclin.'
  }
},
{
  id:'svt-systeme-nerveux', matiereKey:'svt', matiere:'SVT', niveau:'4e',
  titre:'Le système nerveux : de la stimulation au mouvement',
  motsCles:['nerf','cerveau','neurone','message nerveux','récepteur','effecteur','moelle épinière','synapse','réflexe','drogues'],
  contenu:{
    objectifs:['Décrire le trajet d’un message nerveux.','Comprendre la commande d’un mouvement et les dangers pour ce système.'],
    notions:[
      {terme:'Récepteur sensoriel', def:'organe des sens (œil, oreille, peau…) qui détecte un stimulus et crée un message nerveux.'},
      {terme:'Message nerveux', def:'signal de nature électrique qui circule dans les nerfs, toujours dans un seul sens.'},
      {terme:'Nerfs', def:'câbles reliant récepteurs, centres nerveux et muscles ; nerfs sensitifs (vers le centre) et moteurs (vers les muscles).'},
      {terme:'Centres nerveux', def:'cerveau (analyse, décisions volontaires) et moelle épinière (réflexes) ; ils reçoivent, traitent l’information et commandent la réponse.'},
      {terme:'Neurone', def:'cellule nerveuse ; les neurones communiquent entre eux au niveau des synapses grâce à des messagers chimiques.'},
      {terme:'Effecteur', def:'muscle qui exécute la réponse (le mouvement).'}
    ],
    essentiel:'<p>Face à un <b>stimulus</b>, un <b>récepteur sensoriel</b> crée un <b>message nerveux</b> (électrique). Ce message est transmis par un <b>nerf sensitif</b> jusqu’à un <b>centre nerveux</b> (cerveau ou moelle épinière). Le centre analyse l’information et élabore une réponse, transmise par un <b>nerf moteur</b> jusqu’au <b>muscle</b> (effecteur) qui se contracte : c’est le mouvement.</p><p>Le trajet complet est donc : <b>récepteur → nerf sensitif → centre nerveux → nerf moteur → muscle</b>. Les neurones communiquent entre eux au niveau des <b>synapses</b>. Certains mouvements sont <b>volontaires</b> (commandés par le cerveau), d’autres sont des <b>réflexes</b> (très rapides, gérés par la moelle épinière, ex. retirer sa main d’une source de chaleur).</p><p>Ce système est <b>fragile</b> : l’<b>alcool</b>, les <b>drogues</b>, la <b>fatigue</b> ou un choc ralentissent la transmission des messages, augmentent le temps de réaction et peuvent provoquer des accidents. Le port du casque protège le cerveau.</p>',
    exemple:'<p>Au volant, l’alcool allonge le temps de réaction : la distance parcourue avant de freiner augmente fortement.</p>',
    retenir:'Trajet : <b>récepteur → nerf → centre nerveux → nerf → muscle</b>. Alcool, drogues et fatigue <b>allongent le temps de réaction</b>.'
  }
},
{
  id:'svt-immunite', matiereKey:'svt', matiere:'SVT', niveau:'3e',
  titre:'Le sang et le système immunitaire',
  motsCles:['immunité','micro-organisme','anticorps','globules blancs','vaccin','antibiotique','antigène','phagocytose','lymphocyte','mémoire'],
  contenu:{
    objectifs:['Comprendre comment l’organisme se défend contre les microbes.','Distinguer vaccination et traitement antibiotique.'],
    notions:[
      {terme:'Micro-organismes', def:'bactéries, virus, champignons ; ceux qui provoquent des maladies sont dits pathogènes.'},
      {terme:'Contamination / infection', def:'contamination = entrée du microbe dans le corps ; infection = sa multiplication.'},
      {terme:'Phagocytose', def:'des globules blancs (phagocytes) « avalent » et digèrent les microbes ; réaction rapide et générale.'},
      {terme:'Lymphocytes', def:'globules blancs spécifiques : les lymphocytes B produisent des anticorps, les lymphocytes T détruisent les cellules infectées.'},
      {terme:'Anticorps', def:'molécules qui se fixent précisément sur un microbe (son antigène) pour le neutraliser.'},
      {terme:'Mémoire immunitaire', def:'après un premier contact, l’organisme réagit plus vite et plus fort lors d’un second contact.'}
    ],
    essentiel:'<p>La <b>peau</b> et les <b>muqueuses</b> forment une première barrière contre les microbes. Si un microbe pénètre, l’organisme réagit d’abord par la <b>phagocytose</b> (des globules blancs détruisent le microbe) : c’est une défense rapide et non spécifique.</p><p>Si cela ne suffit pas, une réponse plus lente et <b>spécifique</b> se met en place grâce aux <b>lymphocytes</b> : les lymphocytes B fabriquent des <b>anticorps</b> adaptés au microbe, les lymphocytes T détruisent les cellules infectées. Après la guérison, une <b>mémoire immunitaire</b> subsiste.</p><p>La <b>vaccination</b> exploite cette mémoire : on introduit un microbe inoffensif (ou une partie) pour que le corps fabrique des anticorps et garde la mémoire, sans être malade → il est protégé (immunisé). Les <b>antibiotiques</b>, eux, sont des médicaments qui <b>détruisent les bactéries</b> ; ils sont <b>inefficaces contre les virus</b>. Le VIH (SIDA) attaque justement les lymphocytes et affaiblit les défenses.</p>',
    exemple:'<p>Le vaccin contre le tétanos fait produire des anticorps à l’avance : en cas de blessure, le corps réagit immédiatement.</p>',
    retenir:'Défenses : <b>phagocytose</b> (rapide) puis <b>anticorps/lymphocytes</b> (spécifiques). Vaccin = <b>préventif</b> (mémoire) ; antibiotique = contre les <b>bactéries</b>, jamais les virus.'
  }
},
{
  id:'svt-reproduction', matiereKey:'svt', matiere:'SVT', niveau:'4e',
  titre:'La reproduction humaine et les hormones',
  motsCles:['puberté','hormone','cycle','ovule','spermatozoïde','ovulation','règles','contraception','IST','organe cible'],
  contenu:{
    objectifs:['Comprendre les transformations de la puberté.','Expliquer le rôle des hormones et le cycle féminin.'],
    notions:[
      {terme:'Puberté', def:'ensemble des transformations (déclenchées par des hormones) qui rendent l’appareil reproducteur fonctionnel.'},
      {terme:'Hormone', def:'message chimique fabriqué par un organe, transporté par le sang, qui agit à distance sur un organe cible.'},
      {terme:'Gamètes', def:'spermatozoïdes (produits en continu par les testicules dès la puberté) et ovules (un libéré par cycle chez la femme).'},
      {terme:'Cycle menstruel', def:'d’environ 28 jours : les règles (règles = élimination de la muqueuse utérine) au début, l’ovulation vers le 14ᵉ jour.'},
      {terme:'Ovulation', def:'libération d’un ovule par un ovaire ; période de fécondité maximale.'},
      {terme:'Contraception', def:'méthodes empêchant la grossesse (pilule, préservatif…) ; le préservatif protège aussi des IST.'}
    ],
    essentiel:'<p>À la <b>puberté</b>, le cerveau commande la production d’<b>hormones</b> (par les ovaires et les testicules). Ces hormones, transportées par le <b>sang</b>, provoquent les changements du corps et rendent la reproduction possible : les testicules produisent des <b>spermatozoïdes</b>, les ovaires libèrent des <b>ovules</b>.</p><p>Chez la femme, le fonctionnement est <b>cyclique</b> (~28 jours) : au début, les <b>règles</b> (la muqueuse de l’utérus est éliminée) ; vers le milieu du cycle, l’<b>ovulation</b> ; puis l’utérus se prépare à accueillir un éventuel embryon. S’il y a <b>fécondation</b> (rencontre spermatozoïde + ovule), l’œuf s’implante dans l’utérus : c’est le début d’une grossesse.</p><p>La <b>contraception</b> permet de choisir d’avoir ou non un enfant. Le <b>préservatif</b> a un double rôle : contraception et protection contre les <b>IST</b> (infections sexuellement transmissibles, dont le VIH).</p>',
    exemple:'<p>La pilule contraceptive apporte des hormones qui bloquent l’ovulation : sans ovule libéré, la fécondation est impossible.</p>',
    retenir:'Une <b>hormone</b> voyage par le <b>sang</b> et agit sur un <b>organe cible</b>. Le <b>préservatif</b> protège à la fois de la grossesse et des <b>IST</b>.'
  }
},
{
  id:'svt-digestion', matiereKey:'svt', matiere:'SVT', niveau:'5e',
  titre:'La digestion et la nutrition',
  motsCles:['digestion','nutriment','tube digestif','enzyme','absorption','intestin grêle','villosités','estomac','glucose'],
  contenu:{
    objectifs:['Décrire le trajet et la transformation des aliments.','Comprendre le passage des nutriments dans le sang.'],
    notions:[
      {terme:'Tube digestif', def:'bouche → œsophage → estomac → intestin grêle → gros intestin ; les aliments non digérés forment les excréments.'},
      {terme:'Digestion mécanique', def:'broyage des aliments par les dents et brassage par l’estomac.'},
      {terme:'Digestion chimique', def:'action des enzymes (dans la salive, l’estomac, l’intestin) qui découpent les aliments en petites molécules.'},
      {terme:'Nutriments', def:'petites molécules issues de la digestion (glucose, acides aminés, acides gras…) utilisables par les cellules.'},
      {terme:'Absorption', def:'passage des nutriments à travers la paroi de l’intestin grêle vers le sang.'}
    ],
    essentiel:'<p>Les aliments parcourent le <b>tube digestif</b>. Ils subissent d’abord une <b>digestion mécanique</b> (mastication, brassage) puis une <b>digestion chimique</b> grâce aux <b>enzymes</b> qui les découpent en <b>nutriments</b> (molécules simples comme le glucose).</p><p>Ces nutriments sont ensuite <b>absorbés</b> au niveau de l’<b>intestin grêle</b>, dont la paroi couverte de <b>villosités</b> offre une très grande surface d’échange. Ils passent dans le <b>sang</b>, qui les distribue à toutes les cellules de l’organisme pour les nourrir et leur fournir de l’énergie.</p><p>Ce qui n’est pas digéré ni absorbé continue vers le <b>gros intestin</b> et forme les déchets. Une alimentation variée apporte tous les nutriments nécessaires.</p>',
    exemple:'<p>Un morceau de pain (amidon) est découpé par des enzymes en <b>glucose</b>, absorbé par l’intestin puis distribué aux muscles comme source d’énergie.</p>',
    retenir:'Digestion = <b>mécanique + chimique (enzymes)</b> → nutriments. L’<b>absorption</b> se fait dans l’<b>intestin grêle</b> (villosités).'
  }
},
{
  id:'svt-tectonique', matiereKey:'svt', matiere:'SVT', niveau:'4e',
  titre:'La tectonique des plaques',
  motsCles:['plaque','séisme','volcan','dorsale','subduction','lithosphère','manteau','Wegener','montagne','ceinture de feu'],
  contenu:{
    objectifs:['Décrire la structure de la Terre et les mouvements des plaques.','Relier les plaques aux séismes, volcans et montagnes.'],
    notions:[
      {terme:'Structure de la Terre', def:'de l’extérieur vers l’intérieur : croûte, manteau, noyau.'},
      {terme:'Lithosphère', def:'couche externe rigide (croûte + haut du manteau), découpée en plaques.'},
      {terme:'Plaques tectoniques', def:'grands morceaux rigides qui se déplacent lentement (quelques cm/an) sur une couche plus souple.'},
      {terme:'Dorsale (divergence)', def:'limite où deux plaques s’écartent ; du magma remonte et crée de la nouvelle croûte océanique.'},
      {terme:'Subduction (convergence)', def:'limite où une plaque plonge sous une autre ; à l’origine de séismes puissants et de volcans.'},
      {terme:'Collision', def:'deux plaques continentales se rencontrent et forment des chaînes de montagnes (ex. Himalaya, Alpes).'}
    ],
    essentiel:'<p>La Terre est formée de couches : une <b>croûte</b> superficielle, un <b>manteau</b> épais et un <b>noyau</b> central. La partie externe rigide, la <b>lithosphère</b>, est découpée en <b>plaques</b> qui se déplacent de quelques centimètres par an, portées par les mouvements du manteau.</p><p>Aux <b>frontières</b> des plaques, trois situations existent : les plaques <b>s’écartent</b> (dorsales océaniques, création de croûte), se <b>rapprochent</b> (subduction : une plaque plonge sous l’autre) ou <b>entrent en collision</b> (formation de montagnes). C’est là que se concentrent l’essentiel des <b>séismes</b> et du <b>volcanisme</b>.</p><p>Cette théorie prolonge l’idée de la <b>dérive des continents</b> proposée par Alfred <b>Wegener</b> (formes des côtes qui s’emboîtent, mêmes fossiles et mêmes roches de part et d’autre de l’Atlantique).</p>',
    exemple:'<p>La « <b>ceinture de feu</b> » du Pacifique concentre la majorité des volcans et séismes du monde : elle correspond aux limites de plaques (subductions).</p>',
    retenir:'Séismes, volcans et montagnes se situent aux <b>limites des plaques</b>. Trois types de limites : <b>écartement</b> (dorsale), <b>subduction</b>, <b>collision</b>.'
  }
},
{
  id:'svt-volcans-seismes', matiereKey:'svt', matiere:'SVT', niveau:'4e',
  titre:'Le volcanisme et les séismes',

  contenu:{

    notions:[

    essentiel:'<p>Un volcan est une ouverture par laquelle du <b>magma</b> (roche fondue riche en gaz) remonte depuis une <b>chambre magmatique</b>, à travers une <b>cheminée</b>, jusqu’au cratère. En surface, le magma dégazé devient de la <b>lave</b>.</p><p>Il existe deux grands types d’éruptions. Le volcanisme <b>effusif</b> émet un magma <b>fluide</b> et pauvre en gaz : la lave s’écoule en <b>coulées</b>, l’éruption est spectaculaire mais peu meurtrière. Le volcanisme <b>explosif</b> met en jeu un magma <b>visqueux</b> et riche en gaz : celui-ci forme un bouchon, la pression augmente puis <b>explose</b>, projetant cendres, blocs et surtout des <b>nuées ardentes</b> (nuages brûlants) très dangereuses.</p><p>Les <b>séismes</b> ont une autre origine : sous l’effet des mouvements des plaques, des <b>contraintes</b> s’accumulent dans les roches jusqu’à une <b>rupture brutale</b> le long d’une <b>faille</b>. L’énergie libérée au <b>foyer</b> se propage en <b>ondes sismiques</b> qui font trembler le sol ; l’<b>épicentre</b> subit les secousses les plus fortes. La <b>magnitude</b> mesure l’énergie du séisme.</p><p>Un <b>risque</b> naît quand un <b>aléa</b> (éruption, séisme) menace des <b>enjeux</b> (population, bâtiments). On s’en protège par la <b>prévention</b> : surveillance des volcans, constructions parasismiques, plans d’évacuation, information de la population.</p>',
    exemple:'<p>1902, Montagne Pelée (Martinique) : une éruption explosive et une <b>nuée ardente</b> détruisent la ville de Saint-Pierre en quelques minutes → volcanisme explosif = danger majeur.</p>',
    retenir:'Effusif = lave fluide qui coule ; explosif = gaz + magma visqueux → explosions et nuées ardentes. Séisme = rupture le long d’une <b>faille</b> (foyer → ondes → épicentre). <b>Risque = aléa × enjeux</b>.'
  }
},

  <script>
/* ============================================================
   Révisions Brevet 2027 — Lycée Français Molière (Saragosse)
   App statique : navigation, recherche, fiche du jour, progression.
   ============================================================ */

const FICHES = (window.FICHES || []).slice();

/* Métadonnées des matières : ordre, couleur, emoji */
const MATIERES = [
  { key:'maths',      nom:'Mathématiques', emoji:'📐', color:'var(--maths)' },
  { key:'francais',   nom:'Français',      emoji:'📖', color:'var(--francais)' },
  { key:'histoire',   nom:'Histoire',      emoji:'🏛️', color:'var(--histoire)' },
  { key:'geographie', nom:'Géographie',    emoji:'🌍', color:'var(--geographie)' },
  { key:'emc',        nom:'EMC',           emoji:'⚖️', color:'var(--emc)' },
  { key:'svt',        nom:'SVT',           emoji:'🧬', color:'var(--svt)' },
  { key:'physique',   nom:'Physique-Chimie', emoji:'⚗️', color:'var(--physique)' },
  { key:'techno',     nom:'Technologie',   emoji:'🔧', color:'var(--techno)' },
];
const M_BY_KEY = Object.fromEntries(MATIERES.map(m => [m.key, m]));

/* ---------- Utilitaires ---------- */
const $ = sel => document.querySelector(sel);
const app = $('#app');

function normalize(str){
  return (str || '')
    .toString().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'') // enleve les accents
    .replace(/[^a-z0-9]+/g,' ').trim();
}

/* index de recherche (titre + mots-clés + notions + matière) */
function ficheHaystack(f){
  const notions = (f.contenu?.notions || []).map(n => n.terme + ' ' + n.def).join(' ');
  const obj = (f.contenu?.objectifs || []).join(' ');
  return normalize([f.titre, (f.motsCles||[]).join(' '), M_BY_KEY[f.matiereKey]?.nom,
                    f.niveau, notions, obj, f.contenu?.essentiel].join(' '));
}
FICHES.forEach(f => { f._hay = ficheHaystack(f); f._nt = normalize(f.titre); });

function searchFiches(q){
  const terms = normalize(q).split(' ').filter(Boolean);
  if(!terms.length) return [];
  return FICHES
    .map(f => {
      let score = 0;
      for(const t of terms){
        if(!f._hay.includes(t)) return null; // tous les termes doivent matcher
        if(f._nt.includes(t)) score += 3;           // bonus titre
        if((f.motsCles||[]).some(k => normalize(k).includes(t))) score += 2; // bonus mot-clé
        score += 1;
      }
      return { f, score };
    })
    .filter(Boolean)
    .sort((a,b) => b.score - a.score)
    .map(x => x.f);
}

/* ---------- Progression (localStorage) ---------- */
const STORE = 'brevet_moliere_vues';
function getSeen(){
  try{ return new Set(JSON.parse(localStorage.getItem(STORE) || '[]')); }
  catch{ return new Set(); }
}
function setSeen(set){ localStorage.setItem(STORE, JSON.stringify([...set])); }
function toggleSeen(id){
  const s = getSeen();
  s.has(id) ? s.delete(id) : s.add(id);
  setSeen(s);
  return s.has(id);
}

/* ---------- Fiche du jour (déterministe, tourne chaque jour) ---------- */
function dayNumber(){ return Math.floor(Date.now() / 86400000); }
function ficheDuJour(){
  if(!FICHES.length) return null;
  return FICHES[dayNumber() % FICHES.length];
}

/* ============================================================
   RENDU
   ============================================================ */

function tagMatiere(f){
  const m = M_BY_KEY[f.matiereKey];
  return `<span class="tag matiere" style="--c:${m.color}">${m.emoji} ${m.nom}</span>`;
}
function ficheCard(f){
  const m = M_BY_KEY[f.matiereKey];
  const seen = getSeen().has(f.id);
  const kw = (f.motsCles||[]).slice(0,4).join(' · ');
  return `<article class="fiche-card ${seen?'is-seen':''}" style="--c:${m.color}" data-fiche="${f.id}">
    <span class="seen" title="Révisée">✓</span>
    <div class="tags">${tagMatiere(f)}<span class="tag niveau">${f.niveau}</span></div>
    <h3>${f.titre}</h3>
    <div class="kw">${kw}</div>
  </article>`;
}

/* ---- Accueil ---- */
function renderAccueil(){
  const seen = getSeen();
  const total = FICHES.length;
  const pct = total ? Math.round(seen.size/total*100) : 0;
  const fdj = ficheDuJour();

  const subjectCards = MATIERES.map(m => {
    const n = FICHES.filter(f => f.matiereKey===m.key).length;
    return `<div class="subject-card" style="--c:${m.color}" data-goto="matiere/${m.key}">
      <div class="emoji">${m.emoji}</div>
      <h3>${m.nom}</h3>
      <small>${n} fiche${n>1?'s':''}</small>
    </div>`;
  }).join('');

  app.innerHTML = `
    <section class="hero">
      <h1>Prêt·e pour le Brevet 2027 ?</h1>
      <p>Une fiche par jour, tous les thèmes de la 5<sup>e</sup> à la 3<sup>e</sup> — pour avoir tout revu avant l'épreuve.</p>
      <span class="countdown" id="countdown"></span>
    </section>

    <div class="progresswrap">
      <div class="progressbar"><span style="width:${pct}%"></span></div>
      <small><b>${seen.size}/${total}</b> fiches révisées · ${pct}% du programme</small>
    </div>

    <div class="daily-label">
      <h2>Fiche du jour</h2>
      <span class="pill">🎲 change chaque jour</span>
    </div>
    ${fdj ? ficheFull(fdj, {compact:true}) : '<p class="empty">Aucune fiche disponible.</p>'}

    <div class="daily-label"><h2>Réviser par matière</h2></div>
    <div class="subject-grid">${subjectCards}</div>
  `;

  // compte à rebours (épreuves centres étrangers groupe 1 : ~mi-juin 2027)
  const target = new Date(2027, 5, 15); // 15 juin 2027 (indicatif)
  const days = Math.max(0, Math.ceil((target - new Date()) / 86400000));
  const cd = $('#countdown');
  if(cd) cd.textContent = `⏳ ~${days} jours avant les épreuves écrites (mi-juin 2027, indicatif)`;
}

/* ---- Page matière ---- */
let currentFilter = 'tous';
function renderMatiere(key){
  const m = M_BY_KEY[key];
  if(!m){ renderAccueil(); return; }
  let list = FICHES.filter(f => f.matiereKey===key);
  const niveaux = [...new Set(list.map(f => f.niveau))].sort();

  const draw = () => {
    const filtered = currentFilter==='tous' ? list : list.filter(f => f.niveau===currentFilter);
    $('#matiereList').innerHTML = filtered.length
      ? filtered.map(ficheCard).join('')
      : '<p class="empty">Aucune fiche pour ce niveau.</p>';
    document.querySelectorAll('.filters button').forEach(b =>
      b.classList.toggle('active', b.dataset.f===currentFilter));
  };

  app.innerHTML = `
    <div class="section-title" style="--c:${m.color}">
      <h1>${m.emoji} ${m.nom}</h1><span class="count">${list.length} fiches</span>
    </div>
    <div class="filters">
      <button data-f="tous">Tous les niveaux</button>
      ${niveaux.map(n => `<button data-f="${n}">${n}</button>`).join('')}
    </div>
    <div class="fiche-grid" id="matiereList"></div>
  `;
  document.querySelectorAll('.filters button').forEach(b =>
    b.addEventListener('click', () => { currentFilter = b.dataset.f; draw(); }));
  draw();
}

/* ---- Conseil de rédaction (nouveau barème 2026 : la qualité de la langue compte) ---- */
const REDAC_FAMILLE = {
  maths:'Justifie chaque réponse par une <b>propriété</b> ou un <b>théorème</b> (« d’après…, donc… »), détaille les <b>étapes du calcul</b> et n’oublie pas les <b>unités</b> et une phrase de conclusion.',
  francais:'Appuie-toi sur le texte : <b>cite entre guillemets</b>, <b>nomme les procédés</b> et explique leur <b>effet</b>. Rédige des paragraphes organisés par des <b>connecteurs logiques</b>.',
  histoire:'<b>Situe</b> dans le temps et l’espace, donne des <b>exemples précis</b> (dates, lieux, acteurs, chiffres) et <b>explique</b> chaque idée en une phrase développée.',
  geographie:'<b>Localise</b> et <b>situe</b>, appuie-toi sur des <b>exemples précis</b> (lieux, chiffres, acteurs) et rédige une réponse <b>organisée</b> et justifiée.',
  emc:'Emploie le <b>vocabulaire civique</b>, donne des <b>exemples concrets</b> et <b>argumente</b> ton point de vue de façon nuancée.',
  svt:'Suis la démarche <b>observation → interprétation → conclusion</b>, utilise le <b>vocabulaire scientifique</b> exact et <b>justifie</b> avec les données du document.',
  physique:'Explique ta <b>démarche</b>, écris les <b>relations utilisées</b> (formules), justifie avec les <b>données</b> et conclus par une phrase avec les <b>unités</b>.',
  techno:'Explique le <b>fonctionnement</b> avec le <b>vocabulaire technique</b> exact, justifie tes choix et rédige des réponses <b>claires et structurées</b>.'
};
function redacBlock(f){
  const c = f.contenu || {};
  const conseil = c.redac || REDAC_FAMILLE[f.matiereKey] || '';
  const vocab = (f.motsCles||[]).map(k=>`<span>${k}</span>`).join('');
  return `<div class="redac"><h2>✍️ Rédiger &amp; justifier</h2>
    <p><b>Nouveau barème :</b> la <b>qualité de la rédaction</b> compte. Fais des <b>phrases complètes</b>, <b>justifie</b> tes réponses et soigne l’<b>orthographe</b> et la <b>syntaxe</b>.</p>
    <p>${conseil}</p>
    <div class="redac-vocab"><span class="lbl">Vocabulaire attendu :</span> ${vocab}</div>
  </div>`;
}

/* ---- Contenu d'une fiche ---- */
function ficheFull(f, {compact=false}={}){
  const m = M_BY_KEY[f.matiereKey];
  const c = f.contenu || {};
  const seen = getSeen().has(f.id);
  const block = (title, icon, html) => html ? `<div class="block"><h2>${icon} ${title}</h2>${html}</div>` : '';

  const objectifs = c.objectifs?.length
    ? `<ul>${c.objectifs.map(o=>`<li>${o}</li>`).join('')}</ul>` : '';
  const notions = c.notions?.length
    ? c.notions.map(n=>`<div class="notion"><b>${n.terme}</b> — ${n.def}</div>`).join('') : '';
  const essentiel = c.essentiel ? `<div>${c.essentiel}</div>` : '';
  const methode = c.methode?.length
    ? `<ol class="methode">${c.methode.map(s=>`<li>${s}</li>`).join('')}</ol>` : '';
  const exemple = c.exemple ? `<div class="exemple">${c.exemple}</div>` : '';
  const retenir = c.retenir ? `<div class="retenir"><h2>⭐ À retenir</h2><div>${c.retenir}</div></div>` : '';
  const chips = (f.motsCles||[]).map(k=>`<span data-kw="${k}">${k}</span>`).join('');

  return `<article class="fiche" style="--c:${m.color}" data-ficheroot="${f.id}">
    <div class="fiche-head">
      <div class="tags">${tagMatiere(f)}<span class="tag niveau">${f.niveau}</span></div>
      <h1>${f.titre}</h1>
    </div>
    <div class="fiche-body">
      ${block('Objectifs','🎯',objectifs)}
      ${block('Notions clés','📖',notions)}
      ${block("L'essentiel",'📚',essentiel)}
      ${block('Méthode','🛠️',methode)}
      ${block('Exemple','✏️',exemple)}
      ${retenir}
      ${redacBlock(f)}
      ${block('Mots-clés','🔖',`<div class="chips">${chips}</div>`)}
    </div>
    <div class="fiche-foot">
      <button class="btn btn-check ${seen?'done':''}" data-check="${f.id}">
        ${seen?'✓ Fiche révisée':'Marquer comme révisée'}
      </button>
      ${compact ? `<button class="btn btn-ghost" data-goto="fiche/${f.id}">Ouvrir en grand →</button>`
                : `<button class="btn btn-random" data-random>🎲 Fiche au hasard</button>`}
    </div>
  </article>`;
}

function renderFiche(id){
  const f = FICHES.find(x=>x.id===id);
  if(!f){ renderAccueil(); return; }
  app.innerHTML = `<div class="backlink" data-back>← Retour</div>${ficheFull(f)}`;
}

/* ---- Résultats de recherche ---- */
function renderRecherche(q){
  const res = searchFiches(q);
  $('#searchInput').value = q;
  app.innerHTML = `
    <div class="section-title"><h1>Recherche</h1>
      <span class="count">${res.length} résultat${res.length>1?'s':''} pour « ${q} »</span></div>
    ${res.length
      ? `<div class="fiche-grid">${res.map(ficheCard).join('')}</div>`
      : `<div class="empty"><div class="big">🔍</div>
          <p>Aucune fiche trouvée pour « <b>${q}</b> ».<br>
          Essaie un autre mot-clé (ex. « triangle », « nazi », « énergie », « adn »…).</p></div>`}
  `;
}

/* ============================================================
   NAVIGATION (hash router)
   ============================================================ */
function renderNav(active){
  $('#subjectnav').innerHTML =
    `<a href="#accueil" class="${active==='accueil'?'active':''}">🏠 Accueil</a>` +
    `<a href="#pratique" class="navpratique ${active==='pratique'?'active':''}">📝 Pratique</a>` +
    MATIERES.map(m =>
      `<a href="#matiere/${m.key}" class="${active===m.key?'active':''}">${m.emoji} ${m.nom}</a>`
    ).join('');
}

/* ---- Pratique : annales « centre étranger – groupe 1 » 2026 ---- */
const PRATIQUE = window.PRATIQUE || [];

function renderPratiqueList(){
  const cards = PRATIQUE.map(ex => {
    const m = M_BY_KEY[ex.matiereKey];
    const themes = ex.themes.map(t=>`<span>${t}</span>`).join('');
    return `<div class="prat-card" style="--c:${m.color}" data-goto="pratique/${ex.id}">
      <div class="tags"><span class="tag matiere" style="--c:${m.color}">${m.emoji} ${ex.matiere}</span>
        <span class="tag niveau">${ex.date}</span></div>
      <h3>${ex.titre}</h3>
      <div class="prat-themes">${themes}</div>
    </div>`;
  }).join('');
  app.innerHTML = `
    <div class="section-title"><h1>📝 Pratique</h1>
      <span class="count">Annales 2026 · Centre étranger — groupe 1</span></div>
    <p class="lead">Les épreuves telles qu’elles sont tombées au Lycée Molière (groupe 1, mi-juin 2026).
      Entraîne-toi sur les <b>thèmes officiels</b> : chaque question a sa <b>correction en vert</b> juste en dessous.
      Le <b>sujet officiel complet</b> (avec le corrigé) est lié dans chaque épreuve.</p>
    <div class="fiche-grid">${cards}</div>`;
}

function renderPratiqueExam(id){
  const ex = PRATIQUE.find(x=>x.id===id);
  if(!ex){ renderPratiqueList(); return; }
  const m = M_BY_KEY[ex.matiereKey];
  let qn = 0;
  const exos = ex.exercices.map(exo => {
    const qs = exo.questions.map(item => {
      qn++;
      return `<div class="prat-q">
        <p class="prat-enonce"><span class="prat-num">${qn}</span> ${item.q}</p>
        <div class="prat-sol"><span class="prat-sol-lbl">✅ Correction</span> ${item.sol}</div>
      </div>`;
    }).join('');
    return `<div class="prat-exo"><h2>${exo.titre}</h2>${qs}</div>`;
  }).join('');
  app.innerHTML = `
    <div class="backlink" data-goto="pratique">← Toutes les épreuves</div>
    <article class="fiche prat" style="--c:${m.color}">
      <div class="fiche-head">
        <div class="tags"><span class="tag matiere" style="--c:${m.color}">${m.emoji} ${ex.matiere}</span>
          <span class="tag niveau">${ex.date} · groupe 1</span></div>
        <h1>${ex.titre} — Brevet 2026</h1>
      </div>
      <div class="fiche-body">
        <p>${ex.intro}</p>
        <p><a class="prat-officiel" href="${ex.officiel}" target="_blank" rel="noopener">📄 Sujet officiel + corrigé complet ↗</a></p>
        <div class="prat-toolbar"><button class="btn btn-ghost" data-toggle-sol>🙈 Masquer les corrections</button></div>
        <div class="prat-exos">${exos}</div>
      </div>
    </article>`;
}

function route(){
  const hash = decodeURIComponent(location.hash.slice(1));
  window.scrollTo(0,0);
  if(hash.startsWith('matiere/')){ const k=hash.split('/')[1]; renderNav(k); renderMatiere(k); }
  else if(hash.startsWith('fiche/')){ renderNav(''); renderFiche(hash.split('/')[1]); }
  else if(hash.startsWith('pratique/')){ renderNav('pratique'); renderPratiqueExam(hash.split('/')[1]); }
  else if(hash==='pratique'){ renderNav('pratique'); renderPratiqueList(); }
  else if(hash.startsWith('q/')){ renderNav(''); renderRecherche(hash.slice(2)); }
  else { renderNav('accueil'); renderAccueil(); }
}

/* ---------- Événements globaux ---------- */
$('#searchForm').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('#searchInput').value.trim();
  if(q) location.hash = 'q/' + encodeURIComponent(q);
});

document.addEventListener('click', e => {
  const goto = e.target.closest('[data-goto]');
  if(goto){ location.hash = goto.dataset.goto; return; }

  const card = e.target.closest('[data-fiche]');
  if(card){ location.hash = 'fiche/' + card.dataset.fiche; return; }

  if(e.target.closest('[data-back]')){ history.back(); return; }

  const rnd = e.target.closest('[data-random]');
  if(rnd){
    const f = FICHES[Math.floor(Math.random()*FICHES.length)];
    location.hash = 'fiche/' + f.id; return;
  }

  const kw = e.target.closest('[data-kw]');
  if(kw){ location.hash = 'q/' + encodeURIComponent(kw.dataset.kw); return; }

  const tsol = e.target.closest('[data-toggle-sol]');
  if(tsol){
    const hidden = document.querySelector('.prat-exos')?.classList.toggle('hide-sol');
    tsol.textContent = hidden ? '👁 Afficher les corrections' : '🙈 Masquer les corrections';
    return;
  }

  const check = e.target.closest('[data-check]');
  if(check){
    const nowSeen = toggleSeen(check.dataset.check);
    check.classList.toggle('done', nowSeen);
    check.textContent = nowSeen ? '✓ Fiche révisée' : 'Marquer comme révisée';
    // rafraîchir les pastilles visibles
    document.querySelectorAll(`[data-fiche="${check.dataset.check}"]`)
      .forEach(c => c.classList.toggle('is-seen', nowSeen));
  }
});

window.addEventListener('hashchange', route);
route();

</script>
</body>
</html>

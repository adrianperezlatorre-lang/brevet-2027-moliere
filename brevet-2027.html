<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Révisions Brevet 2027 · Lycée Français Molière de Saragosse</title>
  <style>
:root{
  --bg:#eef1fa;
  --card:#ffffff;
  --ink:#1a1f36;
  --muted:#6b7488;
  --line:#e7eaf3;
  --primary:#4f46e5;
  --primary-dark:#4338ca;
  --shadow-sm:0 2px 10px rgba(26,31,54,.06);
  --shadow:0 10px 34px rgba(26,31,54,.10);
  --shadow-lg:0 20px 50px rgba(26,31,54,.16);
  --radius:20px;

  /* couleurs par matière */
  --maths:#4f46e5;
  --francais:#e11d74;
  --histoire:#c2620a;
  --geographie:#0d9488;
  --emc:#7c3aed;
  --svt:#15a34a;
  --physique:#ea580c;
  --techno:#3f4c66;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color:var(--ink);
  line-height:1.6;
  min-height:100vh;
  background:
    radial-gradient(1100px 620px at 8% -8%, #dfe7ff 0%, rgba(223,231,255,0) 55%),
    radial-gradient(1000px 560px at 108% 4%, #ffe1ef 0%, rgba(255,225,239,0) 52%),
    radial-gradient(900px 620px at 60% 108%, #d6f7ee 0%, rgba(214,247,238,0) 55%),
    var(--bg);
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shine{to{transform:translateX(240%) rotate(25deg)}}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.72);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid rgba(231,234,243,.9);
}
.topbar-inner{
  max-width:1120px;margin:0 auto;padding:14px 22px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:13px}
.brand-logo{
  width:46px;height:46px;border-radius:14px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#e11d74);
  color:#fff;font-weight:800;font-size:23px;
  display:grid;place-items:center;
  box-shadow:0 8px 20px rgba(79,70,229,.4);
}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-text strong{font-size:16px;letter-spacing:-.01em}
.brand-text small{color:var(--muted);font-size:12px}

.search{margin-left:auto;display:flex;align-items:center;gap:6px;
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:6px 8px 6px 18px;min-width:min(370px,60vw);
  box-shadow:var(--shadow-sm);transition:.2s}
.search:focus-within{border-color:#c3c8f0;box-shadow:0 0 0 4px rgba(79,70,229,.14)}
.search input{border:0;background:transparent;outline:none;flex:1;font-size:15px;color:var(--ink);font-family:inherit}
.search button{border:0;background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;
  width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:15px;transition:.2s}
.search button:hover{transform:scale(1.07)}

.subjectnav{
  max-width:1120px;margin:0 auto;padding:0 16px 12px;
  display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;
}
.subjectnav::-webkit-scrollbar{display:none}
.subjectnav a{
  white-space:nowrap;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;
  color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.7);transition:.18s;
}
.subjectnav a:hover{color:var(--ink);border-color:#cfd5ea;transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.subjectnav a.active{color:#fff;background:linear-gradient(135deg,var(--primary),#7c3aed);
  border-color:transparent;box-shadow:0 8px 18px rgba(79,70,229,.34)}

/* ---------- Layout ---------- */
.container{max-width:1120px;margin:0 auto;padding:30px 22px 70px;animation:fadeUp .45s both}
.section-title{display:flex;align-items:center;gap:14px;margin:4px 0 20px}
.section-title h1{font-size:30px;margin:0;letter-spacing:-.02em}
.section-title .count{color:var(--muted);font-size:14px;font-weight:600;
  background:#fff;padding:5px 12px;border-radius:999px;box-shadow:var(--shadow-sm)}
.lead{color:var(--muted);margin:0 0 22px;max-width:70ch}

/* ---------- Hero / accueil ---------- */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(125deg,#4338ca 0%,#6d28d9 45%,#be185d 100%);
  color:#fff;border-radius:26px;padding:34px 34px;margin-bottom:26px;
  box-shadow:var(--shadow-lg);
}
.hero::before{content:"";position:absolute;inset:0;
  background:radial-gradient(520px 240px at 88% -30%, rgba(255,255,255,.28), transparent 60%);
  pointer-events:none}
.hero::after{content:"🎓";position:absolute;right:26px;bottom:-14px;font-size:120px;opacity:.14;transform:rotate(-8deg)}
.hero h1{margin:0 0 8px;font-size:30px;font-weight:800;letter-spacing:-.02em;position:relative}
.hero p{margin:0;opacity:.94;font-size:16px;max-width:60ch;position:relative}
.hero .countdown{margin-top:18px;font-size:14px;font-weight:600;position:relative;
  display:inline-block;background:rgba(255,255,255,.18);padding:8px 16px;border-radius:999px;
  border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(4px)}

.progresswrap{margin:22px 0 8px;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-sm)}
.progressbar{height:14px;background:#eceffa;border-radius:999px;overflow:hidden}
.progressbar>span{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(90deg,#10b981,#22c55e 60%,#84cc16);box-shadow:0 0 14px rgba(34,197,94,.5)}
.progresswrap small{color:var(--muted);display:inline-block;margin-top:9px;font-weight:500}
.progresswrap small b{color:var(--ink)}

.daily-label{display:flex;align-items:center;gap:12px;margin:32px 0 14px}
.daily-label h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.daily-label .pill{background:linear-gradient(135deg,#fff3d6,#ffe1c4);color:#a15c00;font-size:12px;font-weight:800;
  padding:5px 12px;border-radius:999px;border:1px solid #f6d18a;box-shadow:var(--shadow-sm)}

/* ---------- Grille de matières (accueil) ---------- */
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:16px;margin-top:14px}
.subject-card{
  position:relative;overflow:hidden;
  background:
    linear-gradient(160deg, color-mix(in srgb, var(--c,#888) 10%, #fff), #fff 62%);
  border:1px solid var(--line);border-radius:18px;padding:20px;
  cursor:pointer;transition:transform .2s, box-shadow .2s;
  animation:pop .4s both;
}
.subject-card:hover{transform:translateY(-4px);box-shadow:0 18px 34px color-mix(in srgb, var(--c,#888) 26%, transparent)}
.subject-card .emoji{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;
  background:color-mix(in srgb, var(--c,#888) 16%, #fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,#888) 20%,transparent)}
.subject-card h3{margin:12px 0 2px;font-size:17px;font-weight:700}
.subject-card small{color:var(--muted);font-weight:600}
.subject-card::after{content:"→";position:absolute;top:20px;right:20px;color:var(--c,#888);
  font-weight:800;opacity:0;transform:translateX(-6px);transition:.2s}
.subject-card:hover::after{opacity:1;transform:none}

/* ---------- Liste de fiches ---------- */
.fiche-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.fiche-card{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;
  cursor:pointer;transition:transform .2s, box-shadow .2s;position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:9px;animation:fadeUp .4s both;
}
.fiche-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--c,#888),color-mix(in srgb,var(--c,#888) 45%,#fff))}
.fiche-card:hover{transform:translateY(-4px);box-shadow:0 18px 34px color-mix(in srgb,var(--c,#888) 22%,transparent);
  border-color:color-mix(in srgb,var(--c,#888) 30%,var(--line))}
.fiche-grid>*:nth-child(1){animation-delay:.02s}
.fiche-grid>*:nth-child(2){animation-delay:.05s}
.fiche-grid>*:nth-child(3){animation-delay:.08s}
.fiche-grid>*:nth-child(4){animation-delay:.11s}
.fiche-grid>*:nth-child(5){animation-delay:.14s}
.fiche-grid>*:nth-child(6){animation-delay:.17s}
.fiche-grid>*:nth-child(7){animation-delay:.2s}
.fiche-grid>*:nth-child(8){animation-delay:.23s}
.subject-grid>*:nth-child(2){animation-delay:.04s}
.subject-grid>*:nth-child(3){animation-delay:.08s}
.subject-grid>*:nth-child(4){animation-delay:.12s}
.subject-grid>*:nth-child(5){animation-delay:.16s}
.subject-grid>*:nth-child(6){animation-delay:.2s}
.subject-grid>*:nth-child(7){animation-delay:.24s}
.subject-grid>*:nth-child(8){animation-delay:.28s}
.fiche-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:#eef1f9;color:var(--muted)}
.tag.matiere{color:#fff;background:var(--c,#666)}
.tag.niveau{background:#eef1f9;color:#3a4560}
.fiche-card h3{margin:2px 0;font-size:16.5px;line-height:1.35;font-weight:700}
.fiche-card .kw{color:var(--muted);font-size:13px}
.fiche-card .seen{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:50%;
  background:#16a34a;color:#fff;display:grid;place-items:center;font-size:14px;opacity:0;transform:scale(.5);transition:.2s}
.fiche-card.is-seen .seen{opacity:1;transform:none}

/* filtres niveau */
.filters{display:flex;gap:9px;margin-bottom:20px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;color:var(--muted);
  padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:.18s}
.filters button:hover{border-color:#cfd5ea;transform:translateY(-1px)}
.filters button.active{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:var(--shadow-sm)}

/* ---------- Fiche détail ---------- */
.fiche{background:var(--card);border:1px solid var(--line);border-radius:24px;
  box-shadow:var(--shadow-lg);overflow:hidden;max-width:840px;margin:0 auto;animation:pop .4s both}
.fiche-head{position:relative;overflow:hidden;padding:28px 30px;color:#fff;
  background:linear-gradient(130deg, var(--c,#333), color-mix(in srgb, var(--c,#333) 62%, #000 12%))}
.fiche-head::before{content:"";position:absolute;inset:0;
  background:radial-gradient(420px 200px at 90% -40%, rgba(255,255,255,.3), transparent 60%)}
.fiche-head .tags{display:flex;gap:8px;margin-bottom:12px;position:relative}
.fiche-head .tags .tag{background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(3px)}
.fiche-head h1{margin:0;font-size:29px;font-weight:800;letter-spacing:-.02em;position:relative}
.fiche-body{padding:26px 30px}
.block{margin-bottom:24px}
.block h2{font-size:13px;margin:0 0 12px;display:flex;align-items:center;gap:8px;
  text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--c,#333)}
.block ul{margin:0;padding-left:6px;list-style:none}
.block ul li{position:relative;padding-left:24px;margin:8px 0}
.block ul li::before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;border-radius:50%;
  background:var(--c,#333);opacity:.55}
.block p{margin:0 0 10px}
.notion{border-left:3px solid color-mix(in srgb,var(--c,#333) 40%,var(--line));
  background:color-mix(in srgb,var(--c,#333) 5%,#fff);border-radius:0 10px 10px 0;
  padding:8px 14px;margin:9px 0}
.notion b{color:var(--ink)}
.methode{counter-reset:step;list-style:none;padding-left:0}
.methode li{position:relative;padding-left:42px;margin:12px 0}
.methode li::before{counter-increment:step;content:counter(step);
  position:absolute;left:0;top:-3px;width:28px;height:28px;border-radius:9px;
  background:linear-gradient(135deg,var(--c,#333),color-mix(in srgb,var(--c,#333) 55%,#000 10%));
  color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;box-shadow:var(--shadow-sm)}
.retenir{background:linear-gradient(135deg,#fffbeb,#fef6d8);border:1px solid #fde68a;border-radius:16px;padding:16px 18px}
.retenir h2{color:#a15c00}
.exemple{background:linear-gradient(135deg,#f0f6ff,#eaf1ff);border:1px solid #d6e4ff;border-radius:16px;padding:16px 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:color-mix(in srgb,var(--c,#666) 10%,#fff);color:color-mix(in srgb,var(--c,#666) 65%,#333);
  font-size:13px;font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer;transition:.16s;
  border:1px solid color-mix(in srgb,var(--c,#666) 20%,transparent)}
.chips span:hover{background:var(--c,#666);color:#fff;transform:translateY(-1px)}
kbd{background:#eef1f9;border-radius:6px;padding:1px 7px;font-family:inherit;font-size:.95em;border:1px solid var(--line)}

.fiche-foot{display:flex;justify-content:space-between;align-items:center;
  padding:18px 30px;border-top:1px solid var(--line);background:#fbfcfe;flex-wrap:wrap;gap:12px}
.btn{border:0;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:800;cursor:pointer;
  font-family:inherit;transition:.18s}
.btn:hover{transform:translateY(-2px)}
.btn-check{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 8px 18px rgba(22,163,74,.32)}
.btn-check.done{background:#e7f6ec;color:#15803d;border:1px solid #a7e0ba;box-shadow:none}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--muted)}
.btn-random{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;box-shadow:0 8px 18px rgba(79,70,229,.32)}

.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;
  margin-bottom:18px;cursor:pointer;background:#fff;padding:8px 16px;border-radius:999px;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:.18s}
.backlink:hover{color:var(--ink);transform:translateX(-3px)}

.empty{text-align:center;padding:64px 20px;color:var(--muted);background:#fff;border-radius:20px;
  border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.empty .big{font-size:46px;margin-bottom:8px}

.footer{max-width:1120px;margin:0 auto;padding:10px 22px 40px;color:var(--muted);font-size:13px;text-align:center}

@media(max-width:640px){
  .search{min-width:100%;order:3}
  .brand-text small{display:none}
  .hero{padding:26px 22px}
  .hero h1,.section-title h1{font-size:24px}
  .fiche-head h1{font-size:23px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}

</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#accueil" class="brand">
        <span class="brand-logo">M</span>
        <span class="brand-text">
          <strong>Révisions Brevet 2027</strong>
          <small>Lycée Français International Molière · Saragosse</small>
        </span>
      </a>
      <form class="search" id="searchForm" role="search">
        <input id="searchInput" type="search" placeholder="Rechercher un thème, un mot-clé…"
               autocomplete="off" aria-label="Rechercher une fiche" />
        <button type="submit" aria-label="Rechercher">🔍</button>
      </form>
    </div>
    <nav class="subjectnav" id="subjectnav"></nav>
  </header>

  <main id="app" class="container"></main>

  <footer class="footer">
    <p>Fiches de révision · programmes du cycle 4 (5<sup>e</sup>–4<sup>e</sup>–3<sup>e</sup>) · session 2027.
       Centre étranger — groupe 1.</p>
  </footer>

    ],
    essentiel:'<p>Le théorème de Thalès traduit une situation de <b>proportionnalité</b> créée par des <b>droites parallèles</b> dans un triangle. Il sert à <b>calculer des longueurs</b> ; sa réciproque sert à <b>prouver le parallélisme</b>.</p>',

    essentiel:'<p>La trigonométrie relie un <b>angle aigu</b> et deux côtés d’un triangle rectangle. Moyen mnémotechnique : <b>SOH-CAH-TOA</b>. Pour trouver un angle, on utilise les touches <kbd>cos⁻¹</kbd>, <kbd>sin⁻¹</kbd>, <kbd>tan⁻¹</kbd>.</p>',

  }
},
{
  id:'maths-fractions', matiereKey:'maths', matiere:'Mathématiques', niveau:'4e',

    notions:[
      {terme:'Cycle de vie', def:'extraction → fabrication → transport → utilisation → fin de vie (recyclage).'},
      {terme:'Impact environnemental', def:'effets de chaque étape sur les ressources et la pollution.'},
      {terme:'Écoconception', def:'concevoir un objet en limitant son impact (matériaux, énergie, recyclage).'}
    ],
    essentiel:'<p>Chaque produit a un <b>cycle de vie</b> qui consomme des ressources et génère des <b>déchets</b>. L’<b>écoconception</b> vise à réduire cet <b>impact</b> à toutes les étapes.</p>',
    retenir:'Penser un objet, c’est aussi penser sa <b>fin de vie</b> (réparation, recyclage).'
  }
}
]);

</script>
  <!-- Application -->
  <script>
/* ============================================================
   Révisions Brevet 2027 — Lycée Français Molière (Saragosse)
   App statique : navigation, recherche, fiche du jour, progression.
   ============================================================ */

const FICHES = (window.FICHES || []).slice();

/* Métadonnées des matières : ordre, couleur, emoji */
const MATIERES = [
  { key:'maths',      nom:'Mathématiques', emoji:'📐', color:'var(--maths)' },
  { key:'francais',   nom:'Français',      emoji:'📖', color:'var(--francais)' },
  { key:'histoire',   nom:'Histoire',      emoji:'🏛️', color:'var(--histoire)' },
  { key:'geographie', nom:'Géographie',    emoji:'🌍', color:'var(--geographie)' },
  { key:'emc',        nom:'EMC',           emoji:'⚖️', color:'var(--emc)' },
  { key:'svt',        nom:'SVT',           emoji:'🧬', color:'var(--svt)' },
  { key:'physique',   nom:'Physique-Chimie', emoji:'⚗️', color:'var(--physique)' },
  { key:'techno',     nom:'Technologie',   emoji:'🔧', color:'var(--techno)' },
];
const M_BY_KEY = Object.fromEntries(MATIERES.map(m => [m.key, m]));

/* ---------- Utilitaires ---------- */
const $ = sel => document.querySelector(sel);
const app = $('#app');

function normalize(str){
  return (str || '')
    .toString().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'') // enleve les accents
    .replace(/[^a-z0-9]+/g,' ').trim();
}

/* index de recherche (titre + mots-clés + notions + matière) */
function ficheHaystack(f){
  const notions = (f.contenu?.notions || []).map(n => n.terme + ' ' + n.def).join(' ');
  const obj = (f.contenu?.objectifs || []).join(' ');
  return normalize([f.titre, (f.motsCles||[]).join(' '), M_BY_KEY[f.matiereKey]?.nom,
                    f.niveau, notions, obj, f.contenu?.essentiel].join(' '));
}
FICHES.forEach(f => { f._hay = ficheHaystack(f); f._nt = normalize(f.titre); });

function searchFiches(q){
  const terms = normalize(q).split(' ').filter(Boolean);
  if(!terms.length) return [];
  return FICHES
    .map(f => {
      let score = 0;
      for(const t of terms){
        if(!f._hay.includes(t)) return null; // tous les termes doivent matcher
        if(f._nt.includes(t)) score += 3;           // bonus titre
        if((f.motsCles||[]).some(k => normalize(k).includes(t))) score += 2; // bonus mot-clé
        score += 1;
      }
      return { f, score };
    })
    .filter(Boolean)
    .sort((a,b) => b.score - a.score)
    .map(x => x.f);
}

/* ---------- Progression (localStorage) ---------- */
const STORE = 'brevet_moliere_vues';
function getSeen(){
  try{ return new Set(JSON.parse(localStorage.getItem(STORE) || '[]')); }
  catch{ return new Set(); }
}
function setSeen(set){ localStorage.setItem(STORE, JSON.stringify([...set])); }
function toggleSeen(id){
  const s = getSeen();
  s.has(id) ? s.delete(id) : s.add(id);
  setSeen(s);
  return s.has(id);
}

/* ---------- Fiche du jour (déterministe, tourne chaque jour) ---------- */
function dayNumber(){ return Math.floor(Date.now() / 86400000); }
function ficheDuJour(){
  if(!FICHES.length) return null;
  return FICHES[dayNumber() % FICHES.length];
}

/* ============================================================
   RENDU
   ============================================================ */

function tagMatiere(f){
  const m = M_BY_KEY[f.matiereKey];
  return `<span class="tag matiere" style="--c:${m.color}">${m.emoji} ${m.nom}</span>`;
}
function ficheCard(f){
  const m = M_BY_KEY[f.matiereKey];
  const seen = getSeen().has(f.id);
  const kw = (f.motsCles||[]).slice(0,4).join(' · ');
  return `<article class="fiche-card ${seen?'is-seen':''}" style="--c:${m.color}" data-fiche="${f.id}">
    <span class="seen" title="Révisée">✓</span>
    <div class="tags">${tagMatiere(f)}<span class="tag niveau">${f.niveau}</span></div>
    <h3>${f.titre}</h3>
    <div class="kw">${kw}</div>
  </article>`;
}

/* ---- Accueil ---- */
function renderAccueil(){
  const seen = getSeen();
  const total = FICHES.length;
  const pct = total ? Math.round(seen.size/total*100) : 0;
  const fdj = ficheDuJour();

  const subjectCards = MATIERES.map(m => {
    const n = FICHES.filter(f => f.matiereKey===m.key).length;
    return `<div class="subject-card" style="--c:${m.color}" data-goto="matiere/${m.key}">
      <div class="emoji">${m.emoji}</div>
      <h3>${m.nom}</h3>
      <small>${n} fiche${n>1?'s':''}</small>
    </div>`;
  }).join('');

  app.innerHTML = `
    <section class="hero">
      <h1>Prêt·e pour le Brevet 2027 ?</h1>
      <p>Une fiche par jour, tous les thèmes de la 5<sup>e</sup> à la 3<sup>e</sup> — pour avoir tout revu avant l'épreuve.</p>
      <span class="countdown" id="countdown"></span>
    </section>

    <div class="progresswrap">
      <div class="progressbar"><span style="width:${pct}%"></span></div>
      <small><b>${seen.size}/${total}</b> fiches révisées · ${pct}% du programme</small>
    </div>

    <div class="daily-label">
      <h2>Fiche du jour</h2>
      <span class="pill">🎲 change chaque jour</span>
    </div>
    ${fdj ? ficheFull(fdj, {compact:true}) : '<p class="empty">Aucune fiche disponible.</p>'}

    <div class="daily-label"><h2>Réviser par matière</h2></div>
    <div class="subject-grid">${subjectCards}</div>
  `;

  // compte à rebours (épreuves centres étrangers groupe 1 : ~mi-juin 2027)
  const target = new Date(2027, 5, 15); // 15 juin 2027 (indicatif)
  const days = Math.max(0, Math.ceil((target - new Date()) / 86400000));
  const cd = $('#countdown');
  if(cd) cd.textContent = `⏳ ~${days} jours avant les épreuves écrites (mi-juin 2027, indicatif)`;
}

/* ---- Page matière ---- */
let currentFilter = 'tous';
function renderMatiere(key){
  const m = M_BY_KEY[key];
  if(!m){ renderAccueil(); return; }
  let list = FICHES.filter(f => f.matiereKey===key);
  const niveaux = [...new Set(list.map(f => f.niveau))].sort();

  const draw = () => {
    const filtered = currentFilter==='tous' ? list : list.filter(f => f.niveau===currentFilter);
    $('#matiereList').innerHTML = filtered.length
      ? filtered.map(ficheCard).join('')
      : '<p class="empty">Aucune fiche pour ce niveau.</p>';
    document.querySelectorAll('.filters button').forEach(b =>
      b.classList.toggle('active', b.dataset.f===currentFilter));
  };

  app.innerHTML = `
    <div class="section-title" style="--c:${m.color}">
      <h1>${m.emoji} ${m.nom}</h1><span class="count">${list.length} fiches</span>
    </div>
    <div class="filters">
      <button data-f="tous">Tous les niveaux</button>
      ${niveaux.map(n => `<button data-f="${n}">${n}</button>`).join('')}
    </div>
    <div class="fiche-grid" id="matiereList"></div>
  `;
  document.querySelectorAll('.filters button').forEach(b =>
    b.addEventListener('click', () => { currentFilter = b.dataset.f; draw(); }));
  draw();
}

/* ---- Contenu d'une fiche ---- */
function ficheFull(f, {compact=false}={}){
  const m = M_BY_KEY[f.matiereKey];
  const c = f.contenu || {};
  const seen = getSeen().has(f.id);
  const block = (title, icon, html) => html ? `<div class="block"><h2>${icon} ${title}</h2>${html}</div>` : '';

  const objectifs = c.objectifs?.length
    ? `<ul>${c.objectifs.map(o=>`<li>${o}</li>`).join('')}</ul>` : '';
  const notions = c.notions?.length
    ? c.notions.map(n=>`<div class="notion"><b>${n.terme}</b> — ${n.def}</div>`).join('') : '';
  const essentiel = c.essentiel ? `<div>${c.essentiel}</div>` : '';
  const methode = c.methode?.length
    ? `<ol class="methode">${c.methode.map(s=>`<li>${s}</li>`).join('')}</ol>` : '';
  const exemple = c.exemple ? `<div class="exemple">${c.exemple}</div>` : '';
  const retenir = c.retenir ? `<div class="retenir"><h2>⭐ À retenir</h2><div>${c.retenir}</div></div>` : '';
  const chips = (f.motsCles||[]).map(k=>`<span data-kw="${k}">${k}</span>`).join('');

  return `<article class="fiche" style="--c:${m.color}" data-ficheroot="${f.id}">
    <div class="fiche-head">
      <div class="tags">${tagMatiere(f)}<span class="tag niveau">${f.niveau}</span></div>
      <h1>${f.titre}</h1>
    </div>
    <div class="fiche-body">
      ${block('Objectifs','🎯',objectifs)}
      ${block('Notions clés','📖',notions)}
      ${block("L'essentiel",'📚',essentiel)}
      ${block('Méthode','🛠️',methode)}
      ${block('Exemple','✏️',exemple)}
      ${retenir}
      ${block('Mots-clés','🔖',`<div class="chips">${chips}</div>`)}
    </div>
    <div class="fiche-foot">
      <button class="btn btn-check ${seen?'done':''}" data-check="${f.id}">
        ${seen?'✓ Fiche révisée':'Marquer comme révisée'}
      </button>
      ${compact ? `<button class="btn btn-ghost" data-goto="fiche/${f.id}">Ouvrir en grand →</button>`
                : `<button class="btn btn-random" data-random>🎲 Fiche au hasard</button>`}
    </div>
  </article>`;
}

function renderFiche(id){
  const f = FICHES.find(x=>x.id===id);
  if(!f){ renderAccueil(); return; }
  app.innerHTML = `<div class="backlink" data-back>← Retour</div>${ficheFull(f)}`;
}

/* ---- Résultats de recherche ---- */
function renderRecherche(q){
  const res = searchFiches(q);
  $('#searchInput').value = q;
  app.innerHTML = `
    <div class="section-title"><h1>Recherche</h1>
      <span class="count">${res.length} résultat${res.length>1?'s':''} pour « ${q} »</span></div>
    ${res.length
      ? `<div class="fiche-grid">${res.map(ficheCard).join('')}</div>`
      : `<div class="empty"><div class="big">🔍</div>
          <p>Aucune fiche trouvée pour « <b>${q}</b> ».<br>
          Essaie un autre mot-clé (ex. « triangle », « nazi », « énergie », « adn »…).</p></div>`}
  `;
}

/* ============================================================
   NAVIGATION (hash router)
   ============================================================ */
function renderNav(active){
  $('#subjectnav').innerHTML =
    `<a href="#accueil" class="${active==='accueil'?'active':''}">🏠 Accueil</a>` +
    MATIERES.map(m =>
      `<a href="#matiere/${m.key}" class="${active===m.key?'active':''}">${m.emoji} ${m.nom}</a>`
    ).join('');
}

function route(){
  const hash = decodeURIComponent(location.hash.slice(1));
  window.scrollTo(0,0);
  if(hash.startsWith('matiere/')){ const k=hash.split('/')[1]; renderNav(k); renderMatiere(k); }
  else if(hash.startsWith('fiche/')){ renderNav(''); renderFiche(hash.split('/')[1]); }
  else if(hash.startsWith('q/')){ renderNav(''); renderRecherche(hash.slice(2)); }
  else { renderNav('accueil'); renderAccueil(); }
}

/* ---------- Événements globaux ---------- */
$('#searchForm').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('#searchInput').value.trim();
  if(q) location.hash = 'q/' + encodeURIComponent(q);
});

document.addEventListener('click', e => {
  const goto = e.target.closest('[data-goto]');
  if(goto){ location.hash = goto.dataset.goto; return; }

  const card = e.target.closest('[data-fiche]');
  if(card){ location.hash = 'fiche/' + card.dataset.fiche; return; }

  if(e.target.closest('[data-back]')){ history.back(); return; }

  const rnd = e.target.closest('[data-random]');
  if(rnd){
    const f = FICHES[Math.floor(Math.random()*FICHES.length)];
    location.hash = 'fiche/' + f.id; return;
  }

  const kw = e.target.closest('[data-kw]');
  if(kw){ location.hash = 'q/' + encodeURIComponent(kw.dataset.kw); return; }

  const check = e.target.closest('[data-check]');
  if(check){
    const nowSeen = toggleSeen(check.dataset.check);
    check.classList.toggle('done', nowSeen);
    check.textContent = nowSeen ? '✓ Fiche révisée' : 'Marquer comme révisée';
    // rafraîchir les pastilles visibles
    document.querySelectorAll(`[data-fiche="${check.dataset.check}"]`)
      .forEach(c => c.classList.toggle('is-seen', nowSeen));
  }
});

window.addEventListener('hashchange', route);
route();

</script>
